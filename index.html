<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bright Spot — Multan's Online Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ffffff;
    --panel:#f6f4fb;
    --panel-2:#ece8f9;
    --line: rgba(109,40,217,0.18);
    --ivory:#1a1625;
    --ivory-dim:#6b6478;
    --neon:#F97316;
    --neon-bright:#FB923C;
    --cat-home:#2E7D32;
    --cat-beauty:#B45309;
    --cat-electronics:#1D4ED8;
    --cat-fashion:#C2410C;
    --hero-dark:#0b0714;
    --radius: 3px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--ink); color:var(--ivory); font-family:'Jost', sans-serif; font-weight:300; overflow-x:hidden; }
  h1,h2,h3,.display{ font-family:'Sora', sans-serif; font-weight:700; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  img,svg{ display:block; max-width:100%; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
  ::selection{ background:var(--neon); color:var(--ink); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; animation-iteration-count:1 !important; transition-duration:0.1s !important; }
  }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:1px solid var(--neon-bright); outline-offset:3px;
  }

  /* ================= NAV ================= */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:linear-gradient(to bottom, rgba(11,7,20,0.92), rgba(11,7,20,0));
    padding:20px 0; transition:background .4s ease, padding .4s ease;
  }
  header.scrolled{ background:rgba(11,7,20,0.92); backdrop-filter:blur(8px); padding:13px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; }
  .brandmark{ display:flex; align-items:center; gap:10px; font-family:'Sora', sans-serif; font-weight:700; font-size:1.3rem; letter-spacing:-0.01em; color:var(--ivory); }
  header .brandmark{ color:#f5f2fb; }

  .brandmark-sparkle{ position:relative; }
  .shine-text{
    position:relative; display:inline-block;
    color:#ffffff;
    animation:glowPulse 2.6s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%, 100%{ text-shadow:0 0 6px rgba(255,214,0,0.35), 0 0 1px rgba(255,255,255,0.6); }
    50%{ text-shadow:0 0 16px rgba(255,214,0,0.85), 0 0 30px rgba(249,115,22,0.5), 0 0 2px rgba(255,255,255,0.9); }
  }
  .sparkle{
    position:absolute; width:10px; height:10px; pointer-events:none;
    animation:sparkleTwinkle 2.4s ease-in-out infinite;
  }
  .sparkle-1{ top:-6px; right:-4px; animation-delay:0s; }
  .sparkle-2{ bottom:-4px; right:22%; width:7px; height:7px; animation-delay:1.1s; }
  @keyframes sparkleTwinkle{
    0%, 100%{ opacity:0; transform:scale(0.3) rotate(0deg); }
    50%{ opacity:1; transform:scale(1) rotate(25deg); }
  }
  .brandmark svg{ width:26px; height:26px; filter:drop-shadow(0 0 6px rgba(249,115,22,0.7)); }
  .navlinks{ display:flex; gap:22px; font-size:0.85rem; color:rgba(245,242,251,0.7); }
  .navlinks a{ position:relative; padding-bottom:4px; transition:color .3s; }
  .navlinks a:hover{ color:var(--neon-bright); }
  .navlinks a::after{ content:''; position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--neon-bright); transition:width .35s ease; }
  .navlinks a:hover::after{ width:100%; }
  
  .nav-cta{
    display:flex; align-items:center; gap:8px; border:1px solid var(--neon-bright); padding:9px 18px;
    font-size:0.85rem; color:var(--neon-bright); transition:background .3s, color .3s;
    box-shadow:0 0 18px rgba(249,115,22,0.3);
  }
  .nav-cta:hover{ background:var(--neon-bright); color:#0b0714; }
  .nav-cta svg{ width:15px; height:15px; }

  /* Admin Nav Button Styles */
  .nav-admin{
    display:flex; align-items:center; gap:6px; border:1px solid rgba(245,242,251,0.25); padding:9px 14px;
    font-size:0.85rem; color:#f5f2fb; background:none; transition:border-color .3s, color .3s;
  }
  .nav-admin:hover{ border-color:var(--neon); color:var(--neon); }
  .nav-admin svg{ width:14px; height:14px; }

  .burger{ display:none; width:26px; height:18px; position:relative; cursor:pointer; }
  .burger span{ position:absolute; left:0; right:0; height:1px; background:#f5f2fb; transition:.3s; }
  .burger span:nth-child(1){ top:0; }
  .burger span:nth-child(2){ top:8px; }
  .burger span:nth-child(3){ top:16px; }
  .mobile-menu{
    position:fixed; inset:0; background:var(--hero-dark); z-index:99; color:#f5f2fb;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
    font-family:'Sora', sans-serif; font-size:1.4rem; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .35s ease;
  }
  .mobile-menu.open{ opacity:1; pointer-events:auto; }

  /* ================= HERO ================= */
  .hero{
    position:relative; width:100%; aspect-ratio:16/9;
    background:radial-gradient(ellipse at 50% 10%, #1a0f2e 0%, var(--hero-dark) 62%);
    overflow:hidden; color:#f5f2fb;
  }
  #emberCanvas{ position:absolute; inset:0; width:100%; height:100%; opacity:0.7; z-index:1; }
  .hero-video-layer{ position:absolute; inset:0; z-index:0; overflow:hidden; }
  .hero-video-layer video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:1; animation:fadeInVideo 1.5s ease forwards;
  }
  @keyframes fadeInVideo{ from{ opacity:0; } to{ opacity:1; } }
  .hero-video-layer::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(11,7,20,0.55) 0%, rgba(11,7,20,0.05) 40%, transparent 70%);
  }

  .cat-video{
    position:relative; width:100%; height:260px; overflow:hidden; margin-bottom:48px;
    border:1px solid var(--line);
  }
  .cat-video video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.55; }
  .cat-video::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, var(--hero-dark) 0%, rgba(11,7,20,0.1) 70%); }
  .cat-video .cat-video-label{
    position:absolute; left:24px; bottom:18px; z-index:2; font-family:'Sora',sans-serif; font-weight:700;
    font-size:1.3rem; color:#f5f2fb; text-shadow:0 0 20px var(--cat-accent, var(--neon));
  }
  @media(max-width:768px){ .cat-video{ height:180px; } }
  .hero-text-section{ background:var(--ink); padding:56px 0 60px; text-align:center; }
  .hero-text-section .wrap{ opacity:0; transform:translateY(16px); animation:riseIn .9s ease .15s forwards; }
  .kicker{
    font-size:0.78rem; letter-spacing:0.16em; color:var(--neon); display:flex; align-items:center;
    justify-content:center; gap:14px; margin-bottom:20px;
  }
  .kicker::before, .kicker::after{ content:''; width:34px; height:1px; background:var(--neon); }
  .hero-text-section h1{
    font-size:clamp(1.7rem, 4vw, 2.9rem); line-height:1.15; color:var(--ivory);
    max-width:680px; margin:0 auto;
  }
  .hero-text-section h1 em{
    font-style:normal; color:var(--neon);
  }
  .hero-text-section .lede{
    max-width:520px; margin:20px auto 0; font-size:0.98rem; line-height:1.7; color:var(--ivory-dim);
  }
  .hero-actions{
    display:flex; gap:18px; margin-top:32px; justify-content:center; flex-wrap:wrap;
  }

  .btn{ display:inline-flex; align-items:center; gap:10px; padding:15px 30px; font-size:0.88rem; letter-spacing:0.02em; cursor:pointer; border:1px solid transparent; position:relative; overflow:hidden; font-family:'Sora',sans-serif; font-weight:600; }
  .btn-solid{ background:linear-gradient(120deg, #FB923C, #F97316); color:#ffffff; box-shadow:0 0 30px rgba(249,115,22,0.45); }
  .btn-solid span{ position:relative; z-index:2; }
  .btn-solid::before{ content:''; position:absolute; inset:0; background:var(--neon-bright); transform:translateX(-101%); transition:transform .45s cubic-bezier(.65,0,.35,1); z-index:1; }
  .btn-solid:hover::before{ transform:translateX(0); }
  .btn-ghost{ border-color:var(--line); color:var(--ivory); transition:border-color .3s, color .3s; }
  .btn-ghost:hover{ border-color:var(--neon); color:var(--neon); }

  .hero-stats{
    display:flex; gap:56px; justify-content:center; margin-top:44px; flex-wrap:wrap;
  }
  .hero-stats .num{ font-family:'Sora',sans-serif; font-size:2.1rem; font-weight:700; color:var(--neon); }
  .hero-stats .lbl{ font-size:0.76rem; color:var(--ivory-dim); margin-top:4px; }

  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }
  .scroll-cue{ position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; font-size:0.7rem; letter-spacing:0.16em; color:rgba(245,242,251,0.78); z-index:2; }
  .scroll-cue .line{ width:1px; height:34px; background:linear-gradient(#F97316, transparent); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.3;} 50%{ opacity:1;} }

  /* ================= SECTIONS ================= */
  .section{ padding:110px 0; position:relative; }
  .cat-section{ border-top:1px solid var(--line); scroll-margin-top:90px; }
  .cat-section:nth-child(odd){ background:var(--panel); }
  .cat-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:56px; flex-wrap:wrap; }
  .cat-head .kicker{ justify-content:flex-start; margin-bottom:14px; color:var(--cat-accent, var(--neon)); }
  .cat-head .kicker::before{ background:var(--cat-accent, var(--neon)); }
  .cat-head .kicker::after{ display:none; }
  .cat-head h2{ font-size:clamp(1.9rem, 3.4vw, 2.6rem); color:var(--ivory); }
  .cat-head p{ color:var(--ivory-dim); max-width:380px; font-size:0.95rem; line-height:1.6; }

  .product-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }

  .price{ font-family:'Sora', sans-serif; font-size:1.05rem; font-weight:700; color:var(--ivory); }
  .price span{ font-size:0.66rem; color:var(--ivory-dim); font-weight:400; }

  /* ================= CART ================= */
  .cart-toggle{
    position:relative; display:flex; align-items:center; justify-content:center; width:38px; height:38px;
    border:1px solid rgba(245,242,251,0.25); color:#f5f2fb; cursor:pointer; background:none; transition:border-color .3s;
  }
  .cart-toggle:hover{ border-color:var(--neon); }
  .cart-toggle svg{ width:17px; height:17px; }
  .cart-badge{
    position:absolute; top:-7px; right:-7px; min-width:18px; height:18px; padding:0 4px; border-radius:9px;
    background:var(--neon); color:#ffffff; font-size:0.65rem; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .cart-overlay{
    position:fixed; inset:0; background:rgba(11,7,20,0.6); backdrop-filter:blur(3px); z-index:200;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .cart-overlay.open{ opacity:1; pointer-events:auto; }
  .cart-drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(400px, 92vw); background:var(--panel); z-index:201;
    border-left:1px solid var(--line); display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .4s cubic-bezier(.4,.2,.2,1);
  }
  .cart-overlay.open .cart-drawer{ transform:translateX(0); }
  .cart-header{ display:flex; align-items:center; justify-content:space-between; padding:20px; border-bottom:1px solid var(--line); }
  .cart-header h3{ font-family:'Sora',sans-serif; font-size:1.1rem; color:var(--ivory); }
  .cart-close{ background:none; border:none; color:var(--ivory-dim); font-size:1.4rem; cursor:pointer; line-height:1; }

  .contact{ background:var(--panel); border-top:1px solid var(--line); scroll-margin-top:90px; }
  .contact-grid{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:70px; }
  .contact-info .item{ margin-bottom:28px; }
  .contact-info .label{ font-size:0.74rem; color:var(--neon); letter-spacing:0.08em; margin-bottom:6px; }
  .contact-info .val{ font-size:1.02rem; color:var(--ivory); }

  footer{ padding:44px 0; border-top:1px solid var(--line); }
  .foot-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }

  @media(max-width:980px){
    .product-grid{ grid-template-columns:repeat(2,1fr); }
    .contact-grid{ grid-template-columns:1fr; gap:50px; }
  }
  @media(max-width:768px){
    .navlinks{ display:none; } .nav-cta{ display:none; } .burger{ display:block; }
  }
</style>
</head>

      <div class="burger" id="burger"><span></span><span></span><span></span></div>
    </div>
  </nav>
</header>
